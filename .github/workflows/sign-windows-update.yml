name: Firma aggiornamento Windows

on:
  workflow_dispatch:
    inputs:
      check_key_only:
        description: Controlla soltanto la chiave protetta, senza leggere o modificare release
        default: false
        required: true
        type: boolean
      version:
        description: Versione della bozza, senza v (es. 2.1.0)
        required: false
        type: string
      setup_sha256:
        description: SHA256 atteso del pacchetto Setup
        required: false
        type: string
      setup_size:
        description: Dimensione attesa in byte del pacchetto Setup
        required: false
        type: string
      portable_sha256:
        description: SHA256 atteso del pacchetto Portable
        required: false
        type: string
      portable_size:
        description: Dimensione attesa in byte del pacchetto Portable
        required: false
        type: string
      publish:
        description: Pubblica dopo la verifica (false esegue solo un controllo)
        default: false
        required: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: lsc-windows-release-signing
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'lossantoscustomemerals/lsc-desktop-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Leggi gli strumenti di rilascio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepara Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verifica e firma il rilascio
        run: node scripts/sign-windows-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LSC_UPDATE_SIGNING_KEY_PKCS8: ${{ secrets.LSC_UPDATE_SIGNING_KEY_PKCS8 }}
          RELEASE_VERSION: ${{ inputs.version }}
          SETUP_SHA256: ${{ inputs.setup_sha256 }}
          SETUP_SIZE: ${{ inputs.setup_size }}
          PORTABLE_SHA256: ${{ inputs.portable_sha256 }}
          PORTABLE_SIZE: ${{ inputs.portable_size }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          CHECK_KEY_ONLY: ${{ inputs.check_key_only }}
